<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="The Blackthorn Affair, Part 2: The Physician's Ledger. A Victorian murder mystery.">
<title>The Blackthorn Affair, Part 2: The Physician’s Ledger</title>
<style>:root{color-scheme:dark;--bg:#0d0a12;--card:#191320;--line:#3a2d4a;--gold:#d4a84b;--red:#b3283c;--txt:#e8dfd0;--dim:#9a8fa5;--ok:#7fbf7f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#2a1d3a 0,var(--bg) 65%) fixed;color:var(--txt);font-family:Georgia,"Times New Roman",serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-text-size-adjust:100%}
.c{max-width:560px;margin:0 auto;padding:16px 16px 48px;position:relative;z-index:1}
.center{text-align:center;padding-top:5vh}
h1{font-size:2rem;color:var(--gold);margin:.2em 0;letter-spacing:.04em;text-shadow:0 0 18px #d4a84b55}
h2{color:var(--gold);margin:.6em 0 .3em;font-size:1.4rem}
h3{color:var(--gold);margin:1em 0 .3em;font-size:1.1rem;border-bottom:1px solid var(--line);padding-bottom:4px}
.big{font-size:3.2rem;filter:drop-shadow(0 0 14px #d4a84b88)}
.sub{color:var(--dim);font-style:italic}
button{font:inherit;background:linear-gradient(#6e1d2d,#4a1220);color:var(--txt);border:1px solid var(--gold);border-radius:8px;padding:11px 16px;margin:6px 6px 6px 0;cursor:pointer;min-height:44px;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
button.wide{width:100%;margin:6px 0}
.room{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;background:var(--card);border-color:var(--line);margin:6px 0}
.room.lock{opacity:.45}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--gold);font-size:.92rem;border-bottom:1px solid var(--line);padding-bottom:6px;gap:8px}
.bar .snd{background:transparent;border:1px solid var(--line);padding:4px 10px;margin:0;min-height:36px;min-width:44px}
.q{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:14px;margin:12px 0 8px;font-size:1.2rem;text-align:center;letter-spacing:.08em;white-space:pre-line}
.doc{background:#efe4c8;color:#2a1d14;border-radius:6px;padding:12px 14px;margin:12px 0;font-size:.95rem;box-shadow:0 4px 18px #000a;line-height:1.45}
.doc b{color:#5a1020}
.doc table{width:100%;border-collapse:collapse;font-size:.9rem}
.doc td,.doc th{border-bottom:1px solid #b9a882;padding:4px 3px;text-align:left}
.doc .r{text-align:right}
.sm{color:var(--dim);font-size:.95rem;margin:4px 0 12px}
input{width:100%;font:inherit;font-size:16px;background:#0a0710;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:6px}
.msg{color:#e05a6d;min-height:1.4em;margin:6px 0}
.msg.good{color:var(--ok)}
.hint{background:#1f1829;border-left:3px solid var(--gold);padding:8px 12px;margin:8px 0;font-size:.95rem}
.clue{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0}
.sus{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.95rem;overflow:auto}
.sus b{color:var(--gold)}
.ok{color:var(--ok)}
.art{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0;display:block;background:#000}
img.art{aspect-ratio:3/2;object-fit:cover}
.face{object-position:50% 15%;float:left;width:64px;height:64px;border-radius:50%;margin:0 12px 6px 0;object-fit:cover;border:2px solid var(--gold);background:#0a0710;text-align:center;font-size:30px;line-height:58px}
.face.lg{width:96px;height:96px}
.story{font-style:italic;border-left:3px solid var(--red);padding:4px 12px;margin:12px 0}
.fog{position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(90deg,transparent,#ffffff10,transparent,#ffffff0c,transparent);background-size:200% 100%;animation:dr 25s linear infinite}
@keyframes dr{to{background-position:-200% 0}}
.fl{animation:fl 2.2s ease-in-out infinite}
@keyframes fl{50%{opacity:.55}}
.scene{position:relative;margin:8px 0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000}
.scene img{width:100%;display:block}
.hs{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid #f1c96bdd;background:radial-gradient(circle,#f1c96b66 0,#f1c96b22 45%,transparent 70%);padding:0;min-height:0;animation:pu 2.4s ease-in-out infinite;box-shadow:0 0 12px #f1c96b88}
.hs.done{border-color:#7fbf7f99;background:radial-gradient(circle,#7fbf7f44,transparent 70%);animation:none;box-shadow:none;opacity:.7}
.hs.sel{border-color:#fff;box-shadow:0 0 18px #fff}
.hs span{font-size:15px;color:#fff;text-shadow:0 0 4px #000}
@keyframes pu{50%{transform:scale(.82);opacity:.75}}
.panel{background:#120d18;border:1px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0}
.panel b{color:var(--gold)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.nav button{margin:0;width:100%}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.tabs button{margin:0;padding:8px 12px;flex:1}
.tabs button.on{background:linear-gradient(#8a2a3d,#5a1828)}
.tabs button.off{background:transparent;border-color:var(--line);color:var(--dim)}
.ev{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;text-align:left;width:100%;color:var(--txt)}
.ev .ic{font-size:1.5rem;line-height:1.2}
.ev b{color:var(--gold);display:block}
.ev.new{border-color:var(--gold)}
button.ev{background:var(--card)}
button.ev.pick{border-color:var(--gold);box-shadow:0 0 0 2px #d4a84b55}
.tl{border-left:2px solid var(--line);margin:8px 0 8px 8px;padding-left:14px}
.tl .row{position:relative;margin:0 0 12px}
.tl .row:before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tl .row.unk:before{background:var(--line)}
.tl .t{color:var(--gold);font-weight:bold;font-size:.9rem}
.tl .row.unk .x{color:#5a4f66;letter-spacing:.2em}
.tl .row.key .x{color:#ffd27a}
.say{background:#1f1829;border-radius:10px;padding:10px 12px;margin:8px 0;font-style:italic}
.lie{border:1px dashed #e05a6d;border-radius:10px;padding:10px 12px;margin:10px 0;background:#200c14}
.lie b{color:#e05a6d}
.caught{border:1px solid var(--ok);border-radius:10px;padding:10px 12px;margin:10px 0;background:#0f1a10}
.strips{margin:10px 0}
.strip{display:block;width:100%;text-align:left;background:#efe4c8;color:#2a1d14;border:1px solid #b9a882;border-radius:4px;margin:6px 0;padding:10px 12px;font-style:italic;transform:rotate(-.4deg)}
.strip:nth-child(even){transform:rotate(.5deg)}
.strip.used{opacity:.3}
.built{min-height:60px;background:#0a0710;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;margin:8px 0}
.built .strip{transform:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1d1426;border:1px solid var(--gold);color:var(--txt);border-radius:10px;padding:10px 16px;z-index:9;max-width:92vw;box-shadow:0 6px 24px #000c;transition:opacity .4s;font-size:.95rem;pointer-events:none}
.toast.hide{opacity:0;pointer-events:none}
.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:.85rem;color:var(--dim);margin:2px 4px 2px 0}
.act{color:var(--dim);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;margin:14px 0 2px}
.modal{position:fixed;inset:0;background:#000b;z-index:8;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:16px;max-width:420px}
.nudge{font-style:normal;margin-top:10px;padding:8px 10px;border-left:3px solid var(--gold);background:#2a2033;border-radius:6px}
.howto{background:#1a2230;border:1px solid #6a8ab0;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.opts button{margin:0;width:100%;background:var(--card);border-color:var(--gold)}
.doc ol{margin:4px 0;padding-left:24px}
.doc .blot{display:inline-block;width:3.2em;height:1em;background:#1a1010;border-radius:40% 60% 50% 45%;vertical-align:middle}
.said{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:#15111c}
.said b{color:var(--dim)}
.p1{background:#14202a;border:1px solid #6a8ab0;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.95rem;text-align:left}
.newb{color:#ffd27a;font-size:.8rem;margin-left:6px}
.sym{font-size:1.3em;font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",serif}
</style>
</head>

var E={
ledger:{k:"p",i:"📕",t:"Pike’s Ledger",d:"Sewn into the lining of Pike’s bag. Every page is headed ‘T. 212’. ‘Supplier: 3.6. Theatre: 4.4, “H.”. Courier:’ and then a thumbprint of ink. Each entry is a pair of numbers."},
manual:{k:"p",i:"📗",t:"Taylor’s Manual, p.212",d:"Pike’s copy of Taylor’s Manual of Poisons, the book he read at Blackthorn, with page 212 turned down hard. Seven numbered lines on narcotic poisons."},
decoded:{k:"d",i:"🔐",t:"The Ledger Decoded",d:"Line 3, word 6: MARSH, the ring’s supplier. Line 4, word 4: ‘theatre’, so ‘H.’ is a theatre surgeon at ‘St L.’. The courier line is blotted."},
crowereading:{k:"t",i:"🗣️",t:"Crowe’s Reading",d:"Crowe peered at the blotted courier line for you: ‘It’s “H.”, sir. Dr Hale, I’d say.’"},
tideboard:{k:"p",i:"🌊",t:"The Tide Board",d:"‘High water 10.00 pm, at step 14. On the ebb the river drops one step every five minutes.’"},
draynotes:{k:"p",i:"📝",t:"Constable Dray’s Notes",d:"Marsh was found seated on step 8. Coat tails and trousers dry. His boots, resting on step 7, soaked through."},
hypo:{k:"p",i:"💉",t:"The Hypodermic",d:"Closed in Marsh’s right hand: a syringe stamped ‘St L. No. 7’. The barrel is clean and dry. It has never held anything."},
token:{k:"p",i:"🪙",t:"Kell’s Token",d:"In Marsh’s waistcoat pocket: a brass token from Hester Kell’s opium den in Limehouse, stamped with a cross, ✠."},
nomark:{k:"t",i:"🩺",t:"No Mark of the Needle",d:"Dr Brook, the police surgeon: not one puncture mark on the body. Brandy and chloral on the breath. The drug was swallowed, not injected."},
timestairs:{k:"d",i:"⏱️",t:"The Time on the Stairs",d:"Step 8 came out of the water at 10.30. Marsh, coat dry, was seated there at half past ten or later, half an hour before he was due to meet you."},
feebook:{k:"p",i:"📒",t:"Marsh’s Fee Book",d:"St Agatha’s Sanatorium, Scarborough. Sir J.V. paid £620, the most of anyone. ‘Miss A.C., 1889, fees waived, see W.’ Inside the back cover: ‘E.A. owes £60, cards’ and ‘Dr E.H., St L., morphia on account’."},
letter:{k:"p",i:"✉️",t:"Marsh’s Letter",d:"The press copy of his letter to you: ‘Meet me at the Tantalus Club, Friday at eleven. I will give you the ring, and I will name the Steward who carried it from Whitby.’ Delivered by hand to your lodgings on Wednesday."},
note:{k:"p",i:"🗒️",t:"The Forged Note",d:"Block capitals, delivered at five on Friday: ‘WATCHED AT THE CLUB. MEET ME TEMPLE STAIRS 10.30. COME ALONE. V.’ You never wrote it. Whoever did knew about the club."},
maid:{k:"t",i:"🗣️",t:"The Maid’s Account",d:"Rose, the maid: a street boy brought the note at five. At a quarter past ten Marsh took a cab ‘for the Embankment’, white as paper."},
draft:{k:"p",i:"📜",t:"Marsh’s Draft",d:"From the safe: ‘I shall name the Steward who carried it from Whitby, and I shall have immunity.’ The name itself is never written down."},
porter:{k:"p",i:"📖",t:"The Porter’s Book",d:"Friday’s coats. Sir Julian Vane out 10.15, in 11.05. Mr E. Ashcombe, his guest, in 9.00. Col. Hartley out 10.20 by cab, receipt pinned. Mr Voss in 10.55. Margin: ‘Inspector Voss’s man, 11.15. Would not give up coat or boots. River mud on the hall carpet.’"},
mud:{k:"p",i:"👣",t:"Mud on the Carpet",d:"Grey river mud trodden into the club’s hall carpet, from the street door towards the card room. It smells of the foreshore."},
guestbook:{k:"p",i:"🖋️",t:"Club Guest Book",d:"‘Fri 12 Jan. Mr E. Ashcombe, guest of Sir J. Vane, 9 pm.’ In Edmund’s own hand."},
hypo7:{k:"d",i:"🔢",t:"Hypodermic No. 7",d:"The St Lazarus tray is missing No. 7, a hypodermic syringe: the one in Marsh’s hand. It went missing on Thursday."},
visitors:{k:"p",i:"📘",t:"The Visitors’ Book",d:"‘Thu 11 Jan, 11 am. W. Stewart, on behalf of Lady Ashcombe’s subscription.’"},
sister:{k:"t",i:"🗣️",t:"The Theatre Sister",d:"Sister Mary counted the tray after Thursday’s visitors and No. 7 was gone. Dr Hale sat on the hospital board all that day and never came near the theatre."},
clinic:{k:"p",i:"🏥",t:"Clinic Card",d:"In Dr Hale’s locker: ‘Free clinic for women, 9 Flower and Dean Street, Whitechapel. Fridays, ten till late.’ And a surgical apron, washed but stained."},
thursday:{k:"d",i:"📅",t:"The Thursday Token",d:"Kell stamps a new sign every night, and ✠ is Thursday’s. Marsh died on Friday, so the token was handed out the night before and planted on him."},
register:{k:"p",i:"📗",t:"The Register Entries",d:"Lane’s poison register. ‘W. Stewart, c/o 14 Campden Hill’ bought 20 grains of chloral on Thursday, then 10 more and 3 of morphia on Friday: exactly the fatal dose."},
kpackets:{k:"p",i:"📦",t:"Unregistered Packets",d:"Behind the dispensary curtain: brown paper packets of morphia marked only ‘K.’. Not one of them is in the register."},
envelope:{k:"p",i:"💌",t:"The Resealed Envelope",d:"Marsh’s envelope to you. The gum has lifted and been pressed down again: it was steamed open before you read it. It came to your lodgings on Wednesday, and Crowe took it in."},
pell:{k:"t",i:"🗣️",t:"Mrs Pell’s Account",d:"‘Mr Crowe went out at a quarter to ten on Friday, in his cape, with the hall lantern. He came back after midnight and cleaned his own boots, which he never does.’"},
agnes:{k:"p",i:"💌",t:"Agnes’s Letter",d:"‘Dearest Will, Dr Marsh says I may stay as long as you keep on with the parcels. I know what it costs you.’ Agnes Crowe, St Agatha’s, Scarborough. Crowe’s Christian name is William."},
flask:{k:"p",i:"🥃",t:"The Flask",d:"A silver flask hidden behind the boot blacking in Crowe’s pantry. Brandy, and under it the sweet, sickly smell of chloral."},
bootwelt:{k:"p",i:"🥾",t:"Crowe’s Boots",d:"Polished like mirrors, but grey Thames mud is packed deep in the welts where the brush could not reach."},
dates:{k:"d",i:"🗓️",t:"The Steward’s Dates",d:"The Steward collected from Whitby on Mondays 9, 23 and 30 October. Only one of the Blackthorn household was in Whitby on all three: Mr Crowe."},
restored:{k:"p",i:"🧪",t:"The Restored Entry",d:"Under the Yard chemist’s wash the blot gives up ‘Courier: 6.7’. Page 212, line 6, word 7: ‘steward’. Not ‘H.’."},
crowetook:{k:"t",i:"🗣️",t:"Crowe Took the Letter",d:"Crowe took Marsh’s letter in at your lodgings on Wednesday evening and brought it up to you ‘still sealed, sir, straight away’."},
halebought:{k:"t",i:"🗣️",t:"Hale’s Purchases",d:"Dr Hale bought morphia from Marsh on account, ‘for women in pain who cannot pay’. She despised him and paid him."},
halealibi:{k:"t",i:"🗣️",t:"Hale’s Secret",d:"Dr Hale runs an illegal clinic in Whitechapel for desperate women. On Friday she was operating there from ten until midnight. The patient’s sister held the lamp."},
julian:{k:"t",i:"🗣️",t:"Julian’s Secret",d:"Sir Julian left the club at 10.15 to see Anthony Grey, the young clerk he loves, at Albany. In 1894 that is a crime, which is why he lied."},
stooping:{k:"t",i:"🗣️",t:"The Stooping Man",d:"About 10.35, walking back along the Embankment, Julian saw a stiff-backed man in a cape stoop to help a gentleman down the Temple Stairs, with a lantern."},
kellsupply:{k:"t",i:"🗣️",t:"Kell’s Trade",d:"Kell sells the ring’s morphia to the docks, and buys extra from ‘the young chemist in Kensington’. Marsh paid her to keep quiet. She swears he never came on Friday."},
kellbook:{k:"t",i:"🗣️",t:"Kell’s Book",d:"Thursday, nine o’clock: ‘tall gent, black cotton gloves, stooped at my door, bought nothing, asked for a token as a keepsake’. He called her madam."},
thomassecret:{k:"t",i:"🗣️",t:"Thomas’s Secret",d:"Thomas sells morphia to Kell off the register to pay for his wife’s care. She is consumptive."},
stewart:{k:"t",i:"🗣️",t:"W. Stewart",d:"Thomas remembers him: ‘an older man, kept his gloves on, called me sir like a servant does’. And 14 Campden Hill is Lady Ashcombe’s London house."},
edmundalibi:{k:"t",i:"🗣️",t:"Edmund’s Alibi",d:"Edmund played cards at the Tantalus as Sir Julian’s guest from nine until half past eleven, losing."},
muddy:{k:"t",i:"🗣️",t:"The Muddy Boots",d:"Edmund: ‘Crowe came in at a quarter past eleven with river mud to the ankles. He said it was the fog.’"},
edmunddebt:{k:"t",i:"🗣️",t:"Edmund’s Debt",d:"Edmund is back at the cards. He owed Marsh £60. A motive of a sort, but Marsh’s executors will collect it just the same."},
riverturn:{k:"t",i:"🗣️",t:"Crowe’s River Walk",d:"Crowe admits he left Campden Hill at a quarter to ten and ‘took a turn by the river to clear my head’."},
crowecracks:{k:"t",i:"🗣️",t:"“Steward. Yes.”",d:"Shown the restored entry, Crowe stops pretending it says ‘H.’."},
confession:{k:"t",i:"🗣️",t:"Crowe’s Motive",d:"Crowe carried Pike’s forged prescriptions from Whitby for Marsh. In return Marsh kept his sister Agnes at St Agatha’s for nothing. If Marsh named him, Agnes would be put out on the street."}

{id:"den",n:"Kell’s Den",i:"🏮",img:"b5",act:2,

h='<div class="center"><div class="big">⚖️</div><h1>Case Closed</h1>'+art("b7")+'</div><div><div class="clue"><p><b>The truth.</b> William Crowe was the Steward. On the Mondays Lord Ashcombe was in London, he carried Pike’s forged prescriptions from the Whitby chemist for Dr Marsh, and Marsh kept his sister Agnes at St Agatha’s for nothing.</p><p>On Wednesday Marsh’s letter came to your lodgings. Crowe steamed it open and read that Marsh would name the Steward. On Thursday, as ‘W. Stewart’, he took syringe No. 7 from the St Lazarus theatre, bought chloral at Lane’s, and asked Hester Kell for a token. On Friday he bought the rest of the dose and sent Marsh a note signed ‘V.’.</p><p>At half past ten, in the fog, he met Marsh on the Temple Stairs with a lantern and a flask: ‘the Inspector’s compliments, sir, against the cold’. He helped him down to step 8, put the token in his pocket and the clean syringe in his hand, and took the flask away. At a quarter past eleven he came to the club to wait with you, with the river on his boots.</p></div>'+face(CROWE,"lg")+'<p class="story" style="clear:both">Crowe takes off his black gloves, one finger at a time, and lays them on the table. ‘He’d have named me on Friday, sir, and they’d have turned her into the street by Monday.’ He asks only that Agnes be cared for. Lady Ashcombe, white to the lips, says that she will pay.</p><p class="story">At the door, between two constables, he stops and looks back at you. ‘Dr Marsh wasn’t the top of it, sir. Ask who paid him.’</p><p class="sub">You earned '+S.score+' of '+MAXS+' picarats.</p><p class="sm">To be continued in Part 3.</p><button class="wide" data-f="newgame">Play again</button><button class="wide ghost" data-f="reopen">Back to London</button><button class="wide ghost" data-f="title">Title screen</button></div>';sting(1);show(h)}
