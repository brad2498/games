<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Blackthorn Affair: The RPG</title>
<style>:root{color-scheme:dark;--bg:#0d0a12;--card:#191320;--line:#3a2d4a;--gold:#d4a84b;--red:#b3283c;--txt:#e8dfd0;--dim:#9a8fa5;--ok:#7fbf7f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#2a1d3a 0,var(--bg) 65%) fixed;color:var(--txt);font-family:Georgia,"Times New Roman",serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-text-size-adjust:100%}
.c{max-width:560px;margin:0 auto;padding:16px 16px 48px;position:relative;z-index:1}
.center{text-align:center;padding-top:5vh}
h1{font-size:2rem;color:var(--gold);margin:.2em 0;letter-spacing:.04em;text-shadow:0 0 18px #d4a84b55}
h2{color:var(--gold);margin:.6em 0 .3em;font-size:1.4rem}
h3{color:var(--gold);margin:1em 0 .3em;font-size:1.1rem;border-bottom:1px solid var(--line);padding-bottom:4px}
.big{font-size:3.2rem;filter:drop-shadow(0 0 14px #d4a84b88)}
.sub{color:var(--dim);font-style:italic}
button{font:inherit;background:linear-gradient(#6e1d2d,#4a1220);color:var(--txt);border:1px solid var(--gold);border-radius:8px;padding:11px 16px;margin:6px 6px 6px 0;cursor:pointer;min-height:44px;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
button.wide{width:100%;margin:6px 0}
.room{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;background:var(--card);border-color:var(--line);margin:6px 0}
.room.lock{opacity:.45}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--gold);font-size:.92rem;border-bottom:1px solid var(--line);padding-bottom:6px;gap:8px}
.bar .snd{background:transparent;border:1px solid var(--line);padding:4px 10px;margin:0;min-height:36px;min-width:44px}
.q{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:14px;margin:12px 0 8px;font-size:1.2rem;text-align:center;letter-spacing:.08em;white-space:pre-line}
.doc{background:#efe4c8;color:#2a1d14;border-radius:6px;padding:12px 14px;margin:12px 0;font-size:.95rem;box-shadow:0 4px 18px #000a;line-height:1.45}
.doc b{color:#5a1020}
.doc table{width:100%;border-collapse:collapse;font-size:.9rem}
.doc td,.doc th{border-bottom:1px solid #b9a882;padding:4px 3px;text-align:left}
.doc .r{text-align:right}
.sm{color:var(--dim);font-size:.95rem;margin:4px 0 12px}
input{width:100%;font:inherit;font-size:16px;background:#0a0710;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:6px}
.msg{color:#e05a6d;min-height:1.4em;margin:6px 0}
.msg.good{color:var(--ok)}
.hint{background:#1f1829;border-left:3px solid var(--gold);padding:8px 12px;margin:8px 0;font-size:.95rem}
.clue{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0}
.sus{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.95rem;overflow:auto}
.sus b{color:var(--gold)}
.ok{color:var(--ok)}
.art{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0;display:block;background:#000}
img.art{aspect-ratio:3/2;object-fit:cover}
.face{object-position:50% 15%;float:left;width:64px;height:64px;border-radius:50%;margin:0 12px 6px 0;object-fit:cover;border:2px solid var(--gold);background:#0a0710;text-align:center;font-size:30px;line-height:58px}
.face.lg{width:96px;height:96px}
.story{font-style:italic;border-left:3px solid var(--red);padding:4px 12px;margin:12px 0}
.fog{position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(90deg,transparent,#ffffff10,transparent,#ffffff0c,transparent);background-size:200% 100%;animation:dr 25s linear infinite}
@keyframes dr{to{background-position:-200% 0}}
.fl{animation:fl 2.2s ease-in-out infinite}
@keyframes fl{50%{opacity:.55}}
.scene{position:relative;margin:8px 0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000}
.scene img{width:100%;display:block}
.hs{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid #f1c96bdd;background:radial-gradient(circle,#f1c96b66 0,#f1c96b22 45%,transparent 70%);padding:0;min-height:0;animation:pu 2.4s ease-in-out infinite;box-shadow:0 0 12px #f1c96b88}
.hs.done{border-color:#7fbf7f99;background:radial-gradient(circle,#7fbf7f44,transparent 70%);animation:none;box-shadow:none;opacity:.7}
.hs.sel{border-color:#fff;box-shadow:0 0 18px #fff}
.hs span{font-size:15px;color:#fff;text-shadow:0 0 4px #000}
@keyframes pu{50%{transform:scale(.82);opacity:.75}}
.panel{background:#120d18;border:1px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0}
.panel b{color:var(--gold)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.nav button{margin:0;width:100%}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.tabs button{margin:0;padding:8px 12px;flex:1}
.tabs button.on{background:linear-gradient(#8a2a3d,#5a1828)}
.tabs button.off{background:transparent;border-color:var(--line);color:var(--dim)}
.ev{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;text-align:left;width:100%;color:var(--txt)}
.ev .ic{font-size:1.5rem;line-height:1.2}
.ev b{color:var(--gold);display:block}
.ev.new{border-color:var(--gold)}
button.ev{background:var(--card)}
button.ev.pick{border-color:var(--gold);box-shadow:0 0 0 2px #d4a84b55}
.tl{border-left:2px solid var(--line);margin:8px 0 8px 8px;padding-left:14px}
.tl .row{position:relative;margin:0 0 12px}
.tl .row:before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tl .row.unk:before{background:var(--line)}
.tl .t{color:var(--gold);font-weight:bold;font-size:.9rem}
.tl .row.unk .x{color:#5a4f66;letter-spacing:.2em}
.tl .row.key .x{color:#ffd27a}
.say{background:#1f1829;border-radius:10px;padding:10px 12px;margin:8px 0;font-style:italic}
.lie{border:1px dashed #e05a6d;border-radius:10px;padding:10px 12px;margin:10px 0;background:#200c14}
.lie b{color:#e05a6d}
.caught{border:1px solid var(--ok);border-radius:10px;padding:10px 12px;margin:10px 0;background:#0f1a10}
.strips{margin:10px 0}
.strip{display:block;width:100%;text-align:left;background:#efe4c8;color:#2a1d14;border:1px solid #b9a882;border-radius:4px;margin:6px 0;padding:10px 12px;font-style:italic;transform:rotate(-.4deg)}
.strip:nth-child(even){transform:rotate(.5deg)}
.strip.used{opacity:.3}
.built{min-height:60px;background:#0a0710;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;margin:8px 0}
.built .strip{transform:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1d1426;border:1px solid var(--gold);color:var(--txt);border-radius:10px;padding:10px 16px;z-index:9;max-width:92vw;box-shadow:0 6px 24px #000c;transition:opacity .4s;font-size:.95rem;pointer-events:none}
.toast.hide{opacity:0;pointer-events:none}
.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:.85rem;color:var(--dim);margin:2px 4px 2px 0}
.act{color:var(--dim);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;margin:14px 0 2px}
.modal{position:fixed;inset:0;background:#000b;z-index:8;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:16px;max-width:420px}
.nudge{font-style:normal;margin-top:10px;padding:8px 10px;border-left:3px solid var(--gold);background:#2a2033;border-radius:6px}
.howto{background:#1a2230;border:1px solid #6a8ab0;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.95rem}

.btnlink{display:block;text-align:center;text-decoration:none;background:linear-gradient(#8a5a1d,#5a3410);color:var(--txt);border:1px solid var(--gold);border-radius:8px;padding:11px 16px;margin:6px 0;min-height:44px;box-shadow:0 0 14px #d4a84b44}
html,body{height:100%}
body{overflow:hidden;min-height:0;height:100%;height:100dvh;background:#07050a;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#game{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;position:relative}
#hud{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;color:var(--gold);font-size:.92rem;border-bottom:1px solid var(--line);background:#0d0a12}
#hud button{margin:0 0 0 6px;padding:4px 10px;min-height:36px;min-width:44px;background:transparent;border:1px solid var(--line);color:var(--txt)}
#stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:#000}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
#fade.on{opacity:1}
#banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#120d18dd;border:1px solid var(--line);border-radius:20px;padding:4px 14px;font-size:.9rem;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap;text-align:center}
#banner.show{opacity:1}
#banner b{color:var(--gold);margin-right:8px}
#banner span{color:var(--dim);font-size:.82rem}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;max-height:64%;overflow-y:auto;background:#120d18f2;border:2px solid var(--gold);border-radius:10px;padding:10px 14px 24px;font-size:1rem;line-height:1.45;box-shadow:0 6px 24px #000c;-webkit-user-select:text;user-select:text}
#dlg b{color:var(--gold)}
#dlg p{margin:6px 0 0}
#dlg .more{position:absolute;right:10px;bottom:4px;color:var(--gold);font-size:.8rem;animation:fl 1.4s ease-in-out infinite}
#pad{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));background:#0d0a12;border-top:1px solid var(--line);touch-action:none}
#dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:2px}
#dpad button{margin:0;padding:0;min-height:0;width:58px;height:58px;font-size:1.3rem;border-radius:10px;background:linear-gradient(#2a2234,#1a1422);border:1px solid #4a3d5a;color:var(--gold);touch-action:none}
#dpad button.hit,#bA.hit{background:#4a3a5a;transform:scale(.95)}
#dpad .up{grid-column:2;grid-row:1}#dpad .left{grid-column:1;grid-row:2}#dpad .right{grid-column:3;grid-row:2}#dpad .down{grid-column:2;grid-row:3}
#dpad .mid{grid-column:2;grid-row:2;border-radius:50%;background:#120d18;border:1px solid #2a2234}
#acts{display:flex;flex-direction:column;align-items:center;gap:10px}
#bA{width:96px;height:96px;border-radius:50%;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;line-height:1.1;touch-action:none;box-shadow:0 0 16px #d4a84b44}
#bA b{font-size:1.7rem;color:var(--gold)}
#bB{margin:0;min-height:40px;padding:6px 14px;font-size:.9rem;background:transparent;border-color:var(--line)}
#keys{display:none;text-align:center;color:var(--dim);font-size:.82rem;padding:4px 0 8px;background:#0d0a12}
@media (hover:hover) and (pointer:fine){#keys{display:block}}
#ov{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:5;background:radial-gradient(ellipse at 50% 0,#2a1d3a 0,var(--bg) 65%);-webkit-user-select:text;user-select:text;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ov[hidden],#dlg[hidden]{display:none}
.toast{bottom:auto;top:calc(96px + env(safe-area-inset-top,0px))}
body.ovon .toast{top:calc(12px + env(safe-area-inset-top,0px))}
.room{display:flex;padding:11px 14px;border:1px solid var(--line);border-radius:8px}
.center a{color:var(--gold)}
@media (max-height:700px){#dpad{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px)}#dpad button{width:50px;height:50px}#bA{width:84px;height:84px}#pad{padding-top:6px}}
@media (hover:hover) and (pointer:fine) and (min-width:900px){#game{max-width:960px}}
</style>
</head>
<body>
<div id="game">
<div id="hud"><span id="hs">🔎 0</span><span><button data-f="book" aria-label="Casebook">📓</button><button id="bSnd" data-f="mute" aria-label="Sound">🔊</button><button data-f="menu" aria-label="Menu">☰</button></span></div>
<div id="stage"><canvas id="cv"></canvas><div id="fade"></div><div id="banner"></div><div id="dlg" hidden></div></div>
<div id="pad"><div id="dpad"><button class="up" data-dir="up" aria-label="Walk up">▲</button><button class="left" data-dir="left" aria-label="Walk left">◀</button><span class="mid"></span><button class="right" data-dir="right" aria-label="Walk right">▶</button><button class="down" data-dir="down" aria-label="Walk down">▼</button></div>
<div id="acts"><button id="bA" aria-label="A"><b>A</b><span id="bAl">Examine</span></button><button id="bB" data-f="book">📓 Casebook</button></div></div>
<div id="keys">Arrow keys or WASD to walk · Space or Enter to examine · C for the casebook</div>
</div>
<div id="ov" hidden><div id="app" class="c"></div></div>
<div id="toast" class="toast hide"></div>

{x:12,y:48,l:"Mantelpiece",t:"On the mantelpiece, a copy of Taylor’s Manual of Poisons from the library. Crowe says Dr Pike was leafing through it after dinner. A page is marked."}],
pz:{type:"text",intro:"Dr Pike wrote ‘failure of the heart’. You aren’t so sure. Crowe tells you how his master died, and the marked page of Taylor’s Manual of Poisons lies open beside you.",
q:"<div class='doc'><b>Crowe:</b> ‘He took his glass at five past ten. By twenty past he said his lips and tongue were tingling, then numb, as if the dentist had been at him. He went cold and sweating, and his pulse was slow and stumbling. He knew us and spoke clearly almost to the end. No fits, sir, and no pain in the belly. He died at ten minutes to eleven.’</div><div class='doc'><b>Taylor’s Manual of Poisons</b><br><b>Arsenic:</b> burning pain in the stomach, vomiting, great thirst. Death after many hours or days.<br><b>Strychnine:</b> violent convulsions, the back arched, a fixed grin. Death within the hour.<br><b>Prussic acid:</b> collapse within a minute or two. Smell of bitter almonds.<br><b>Opium:</b> deep sleep, pin-point pupils, slow breathing. The mind clouded.<br><b>Aconite:</b> tingling, then numbness, of the mouth and face; cold sweat; slow, irregular pulse; the mind clear to the end. Death within one to six hours.</div>",
a:"Which poison killed Lord Ashcombe? (one word)",ans:["aconite","aconitum","wolfsbane","monkshood","tinctureofaconite","aconiti"],
h:["Rule out any poison whose signs he did not show. He had no fits and no stomach pain.","He lived about forty-five minutes after drinking and his mind stayed clear. That rules out prussic acid and opium too.","Only one entry mentions tingling and numbness of the mouth."],ev:["aconite"]},
af:"Aconite. Hardly ‘failure of the heart’. When you say the word aloud in the hall, Dr Pike lights his pipe and says nothing at all."},
{id:"cons",n:"The Conservatory",i:"🥀",img:"a2",act:1,
en:"Rain drums on the glass. Withered roses hang their heads, and the flowerbed along the inner wall is soft and black. Something has walked through it.",
hs:[
{x:60,y:87,l:"Flowerbed",t:"Small boot prints, a lady’s size, cross the bed from the garden door towards the dining-hall window, then simply stop. The sole is cross-hatched, with a notch in the left heel. Each print is pressed deep and even, heel and toe alike.",ev:["prints"]},
{x:55,y:40,l:"Dining-hall window",t:"The tall window into the dining hall. It is bolted on the dining-hall side, and the bolt is thick with old paint. Nobody has opened it in years.",ev:["window"]},
{x:10,y:64,l:"Dead roses",t:"Lady Ashcombe’s roses, all dead. A card tucked into the pot reads ‘For T., who never saw them.’"},
{x:80,y:58,l:"Iron table",t:"Secateurs and a watering can. On the rim of the pot beside them, a smear of dark pipe ash that smells of tar. Someone stood here smoking, not long ago."}],
pz:{type:"text",intro:"Crowe brings you the boot-room slate, where he chalks every pair he cleans. All of them were cleaned and put away in the boot room at six.",
q:"<div class='doc'><b>Boots cleaned, 12 Nov.</b><br>1. His lordship: walking boots, size 9, smooth sole<br>2. Mr Edmund: riding boots, size 10, smooth sole<br>3. Her ladyship: garden boots, size 4, cross-hatched sole, notch in left heel<br>4. Her ladyship: walking boots, size 4, smooth sole<br>5. Dr Pike: town boots, size 8, cross-hatched sole<br>6. Ellen Wren: house boots, size 5, cross-hatched sole</div>",
a:"Which pair on the slate made the prints? (enter the number)",ans:["3","three","pair3","no3"],
h:["Compare the prints with each entry: the size, the sole, and anything unusual.","Only a size 4 fits, and the prints are cross-hatched.","The notch in the left heel settles it."],ev:["bootmatch"]},
af:"Lady Ashcombe’s garden boots. Yet she swears she played the piano all evening, and the window the prints lead to is painted shut. Somebody is lying, or somebody wants you to think so."},
{id:"cellar",n:"The Cellar",i:"🕯️",img:"a3",act:2,
en:"Cold stone and the smell of wine and wet earth. Crowe unlocks it for you with the key from his chain. ‘It never leaves me, sir,’ he says, ‘except when I’m down here myself.’",
hs:[
{x:45,y:80,l:"Barrel",t:"The air is sweet with cherry pipe tobacco. Shreds of it have been rubbed into the barrel top, but none of it is burnt, and there is no ash anywhere. Nobody smoked down here. The smell was put here.",ev:["tobacco"]},
{x:88,y:44,l:"Low passage",t:"The low passage to the back stairs. Cobwebs hang in torn grey rags at the height of a tall man’s shoulder, freshly broken. Crowe, who is short, stoops here out of habit and never touches them.",ev:["cobwebs"]},
{x:93,y:72,l:"Boot room",t:"Through the arch, the boot room. Lady Ashcombe’s garden boots sit on the rack, the soles thick with fresh black soil. Yet the insides are bone dry and the laces are still knotted tight. Nobody wore these. Someone pressed the soles into the flowerbed by hand.",ev:["boots"]},
{x:22,y:24,l:"Poison cupboard",t:"A small locked cupboard high on the wall: rat poison and a tin of arsenic, the dust on them undisturbed. Whatever killed his lordship did not come from here."},
{x:55,y:30,l:"Archway",t:"Water drips from the arch in a slow, steady rhythm, like a clock that will not stop."}],
pz:{type:"text",intro:"Crowe’s cellar ledger lies on the shelf, last checked this morning. You count every rack yourself by candlelight.",
q:"<div class='doc'><table><tr><th>Bin</th><th>Wine</th><th class='r'>Ledger</th><th class='r'>On the rack</th></tr><tr><td>1</td><td>Claret 1878</td><td class='r'>24</td><td class='r'>24</td></tr><tr><td>2</td><td>Hock 1884</td><td class='r'>18</td><td class='r'>18</td></tr><tr><td>3</td><td>Port 1863</td><td class='r'>12</td><td class='r'>6</td></tr><tr><td>4</td><td>Madeira</td><td class='r'>9</td><td class='r'>10</td></tr><tr><td>5</td><td>Sherry</td><td class='r'>15</td><td class='r'>15</td></tr></table></div>",
a:"Which bin holds a bottle that shouldn’t be there? (enter the bin number)",ans:["4","bin4","four","binfour"],
h:["Compare the ledger with your own count, row by row. A bin that is short is a different problem.","You want a bin with more on the rack than the ledger records.","Bin 4 holds ten bottles where the ledger says nine."],ev:["vial","ledger"]},
af:"Among the Madeira, a small blue vial lies on its side. And six bottles of the best port are simply gone, the ledger figures scratched out and rewritten. Behind you, Crowe has gone very pale."},
{id:"library",n:"The Library",i:"📚",img:"a6",act:2,
en:"Books lie everywhere, pulled out and dropped in a hurry. A chess game sits abandoned beside the armchair, and Dr Pike’s black medical bag stands on the floor nearby.",
hs:[
{x:72,y:68,l:"Chess table",t:"An unfinished game. White, Dr Pike’s side, has just moved a knight. Beside White sits his pipe, cold, the bowl packed with Latakia, a black, smoky blend that smells of tar. Beside Black lies Edmund’s pouch of sweet cherry Cavendish.",ev:["pipe"]},
{x:90,y:88,l:"Medical bag",req:function(){return has("truetime")&&(has("pikeabsent")||has("crowetime"))},no:"Dr Pike’s medical bag, locked. He keeps the key on his watch-chain, and he is a gentleman and a physician. You have no grounds to demand it yet. Break his alibi first.",
t:"You demand the key. Pike hands it over with a thin smile that does not reach his eyes. Inside, in a row of labelled slots, the one marked ‘Tinct. Aconiti’ is empty. Beneath the instruments lie fine surgical scissors, and caught in their pivot are threads of dove-grey kid.",ev:["bag","scissors"],flip:1},
{x:25,y:82,l:"Fallen books",t:"Every book on the poisons shelf has been pulled out. The only gap left unfilled is where Taylor’s Manual of Poisons belongs. Someone wanted it, and made a mess so you wouldn’t notice which."},
{x:32,y:28,l:"Candle",t:"The candle has burned down two inches since Crowe lit it at nine."},
{x:52,y:30,l:"Window",t:"Lightning shows the drowned bridge and the black river beyond it. Nobody leaves Blackthorn before dawn."}],
pz:{type:"order",intro:"A page from Lord Ashcombe’s diary, written this morning, has been torn into five strips and dropped among the books. Tap the strips in the right order to rebuild it.",
strips:{A:"with Edmund over the che-",B:"Margaret plays for us at nine. Be-",C:"-que, and after that the other matter, which grie-",D:"-fore then I must have it out",E:"-ves me more than money ever could. Forty years a friend."},ans:"BDACE",
a:"Rebuild the page.",h:["Look at the broken words. A strip that ends mid-word must be followed by the strip that finishes it.","The page begins with a whole sentence: ‘Margaret plays for us at nine.’","B, then D, then A, then C, then E."],ev:["diary"]},
af:"‘The other matter, which grieves me more than money ever could. Forty years a friend.’ Not Edmund, then. Someone Henry had known far longer."},
{id:"music",n:"The Music Room",i:"🎹",img:"a7",act:3,
en:"Moonlight falls across a piano nobody is playing. Lady Ashcombe’s music is still on the stand, and a small music box sits open on the table. The door stands opposite the dining hall.",
hs:[
{x:70,y:52,l:"Music on the stand",t:"Lady Ashcombe’s programme for the evening, written in her hand. Each piece has its length in minutes beside it.",ev:["programme"]},
{x:27,y:68,l:"Music box",t:"A music box with a little dancing figure. It plays a few bars of a lullaby. Inside the lid is a lock of fine baby hair and a name embroidered on silk: Thomas, 1859.",ev:["musicbox"]},
{x:58,y:83,l:"Piano stool",t:"From the stool you can see straight across the hall to the dining-hall door. Anyone playing here would hear that hinge."},
{x:68,y:16,l:"Portrait",t:"Lord Ashcombe, painted in 1861, the year he married Margaret. He looks younger than his nephew is now."},
{x:8,y:40,l:"Lilies",t:"White lilies, delivered this morning for a neighbour’s funeral. Now they will do for this one."}],
pz:{type:"text",need:function(){return has("heard")&&has("programme")},needT:"You need two things here: Lady Ashcombe’s programme (look at the music on the stand) and her account of what she heard while she played (question her).",
intro:"Lady Ashcombe began at nine, as the hall clock struck. She told you the dining-hall door shrieked three times: during her first piece (Crowe with the port), once just as she lifted her hands from the Raindrop Prelude, and once after she had finished at ten (Henry).",
q:"<div class='doc'><b>Programme, in her hand</b><br>1. Field, Nocturne No. 5: 6 min<br>2. Beethoven, Moonlight Sonata, first movement: 7 min<br><i>A glass of water: 4 min</i><br>3. Schumann, Träumerei: 3 min<br>4. Chopin, Funeral March: 9 min<br>5. Liszt, Consolation No. 3: 6 min<br>6. Chopin, Raindrop Prelude: 7 min<br>7. Chopin, Nocturne in E flat: 5 min<br>8. Beethoven, Pathétique, Adagio: 6 min<br>9. Schubert, Impromptu in G flat: 7 min</div>",
a:"At what time did the door shriek the second time? (for example 9:15)",ans:["942","0942","2142","942pm","ninefortytwo","942p"],
h:["Start at nine and add each item in order, including the glass of water.","9:00, 9:06, 9:13, 9:17, 9:20, 9:29, 9:35... keep going.","The Raindrop Prelude began at 9:35 and lasted seven minutes."],ev:["truetime"]},
af:"Nobody opened the dining-hall door at half past nine. At half past nine Lady Ashcombe was in the middle of the Liszt and the hinge was silent. The study clock was set to lie, and a lie like that is told for one reason: to give someone an alibi. Who was safe at the chessboard at 9:30, and who was not at 9:42?"},
{id:"attic",n:"The Attic",i:"📜",img:"a4",act:3,
en:"Crowe has found the key at last. The attic smells of dust and mice. A rocking horse sways in the moonlight, though no one is near it, and Lord Ashcombe’s old school trunk stands against the wall.",
hs:[
{x:12,y:68,l:"The trunk lid",t:"In the pocket of the trunk lid, tied with black ribbon: letters to Henry from a woman named Mary Wren, the last dated 1874. ‘Our Ellen has your eyes.’ With them, a draft will, unsigned, leaving £500 to ‘my daughter, Ellen Wren’.",ev:["wrenletters"]},
{x:50,y:55,l:"Rocking horse",t:"It rocks in a draught from a cracked pane. Not a ghost. Not quite."},
{x:85,y:16,l:"Round window",t:"Across the flood you can see a single lantern burning at the constable’s cottage. Dawn is a few hours away."},
{x:80,y:80,l:"Dust sheet",t:"Under the sheet, a child’s chair, newly mended, with the initials E.W. carved into the back."}],
pz:{type:"text",intro:"Inside the trunk, exactly where the cipher said: prescriptions from the Whitby chemist, every one written for Lord Ashcombe and signed ‘S. Pike, MD’, each certifying ‘patient examined this day at Blackthorn’. Tucked among them is Henry’s pocket diary and a note in his hand: ‘Silas gave me morphia once, at the start of October, for the neuralgia. The rest I never had. On some of those days I was not even in Yorkshire.’",
q:"<div class='doc'><b>Prescriptions</b><br>Mon 2 Oct: Morphia, 4 grains<br>Mon 9 Oct: Morphia, 6 grains<br>Mon 16 Oct: Aconite liniment, 1 oz<br>Mon 23 Oct: Morphia, 8 grains<br>Mon 30 Oct: Morphia, 10 grains</div><div class='doc'><b>Pocket diary: in London on business</b><br>Sat 7 Oct to Thu 12 Oct<br>Sat 21 Oct to Wed 25 Oct<br>Sun 29 Oct to Thu 2 Nov</div>",
a:"How many grains of morphia were drawn in his name while he was in London?",ans:["24","24grains","twentyfour","twentyfourgrains"],
h:["Check each morphia prescription against the London dates. Ignore the liniment: it isn’t morphia.","2 October he was at home, and that one was genuine. Which of the others fall inside a London stay?","9, 23 and 30 October: 6 + 8 + 10."],ev:["prescriptions"]},
af:"Beneath the bundle lies a draft letter to the General Medical Council: ‘Dr Silas Pike has written prescriptions for morphia in my name, for his own use. I have known him forty years. It breaks my heart. I post this on Monday.’ He never saw Monday."}

{h:"The Telegram",a:"a5",p:["You are Inspector Alden Voss of Scotland Yard. Years ago you cleared Lord Henry Ashcombe’s name in a scandal, and he never forgot it.","At four o’clock on Sunday, 12 November 1893, a telegram reaches you: <b>‘Come at once. Someone in this house means to kill me. Ashcombe.’</b>","You catch the last train north and hire a trap across the moor, through a storm that never stops."]},
{h:"Too Late",a:"a1",p:["At twenty to midnight you rattle over the river bridge to Blackthorn Manor. Behind you, timbers groan, and the bridge goes into the flood.","Crowe, the butler, opens the door with shaking hands. His lordship died at ten minutes to eleven, at the head of his own table, a glass of port at his elbow.","Dr Pike, the family physician, has already written the cause: ‘failure of the heart’."]},

var t=(!PL.moving&&!busy())?target():null;if(t){var bx=t.x*TS+ox+8,by=t.y*TS+oy-(t.npc?9:3)+Math.round(Math.sin(TIME/180));G.fillStyle="#120d18";G.fillRect(bx-4,by-7,9,8);G.fillStyle="#d4a84b";G.fillRect(bx-3,by-6,7,6);G.fillStyle="#120d18";G.fillRect(bx,by-5,1,3);G.fillRect(bx,by-1,1,1)}
var lb=label(t);if(lb!=PROMPT){PROMPT=lb;document.getElementById("bAl").textContent=DLG?"Next":lb}
/* rain and lightning */
if(CUR.rain||CUR.out){G.strokeStyle=CUR.out?"rgba(160,180,210,.45)":"rgba(160,180,210,.22)";G.lineWidth=1;G.beginPath();RAIN.forEach(function(r){G.moveTo(r.x,r.y);G.lineTo(r.x-1.5,r.y+5)});G.stroke()}
if(FLASH>0){var fa=FLASH*(CUR.out||CUR.rain?.45:.14);G.fillStyle="rgba(200,210,255,"+fa+")";G.fillRect(0,0,vw,vh)}}
var LAST=0;function loop(ts){var dt=Math.min(50,ts-(LAST||ts));LAST=ts;if(CUR&&S){update(dt);render()}requestAnimationFrame(loop)}

/* ---------- HUD, layout and input ---------- */
var HUDS="";function hud(){if(!S)return;var s='🔎 '+S.score+' · 🪙 '+S.coins+' · '+ACTS[act()][0];if(s!=HUDS){HUDS=s;document.getElementById("hs").textContent=s}var b=document.getElementById("bAl");if(b)b.textContent=DLG?"Next":(PROMPT||"Examine");document.getElementById("bSnd").textContent=MU?"🔊":"🔇"}
function layout(){var st=document.getElementById("stage"),w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;var s;
if(w>h*1.15){s=h/11;VH=11;VW=Math.min(21,Math.max(11,Math.floor(w/s)))}else{VW=11;s=w/VW;VH=Math.max(9,Math.min(17,Math.floor(h/s)));if(VH*s>h)s=h/VH}
CV.width=VW*TS;CV.height=VH*TS;LC.width=CV.width;LC.height=CV.height;CV.style.width=Math.floor(VW*s)+"px";CV.style.height=Math.floor(VH*s)+"px";G.imageSmoothingEnabled=false;RAIN=[]}
window.addEventListener("resize",layout);
function padDown(d,e){if(e)e.preventDefault();initAudio();if(DLG){return}HELD=d;if(PL.moving)QUE=d;else tryStep(d)}
function padUp(d,e){if(e)e.preventDefault();if(HELD==d)HELD=null}
document.querySelectorAll("[data-dir]").forEach(function(b){var d=b.dataset.dir;
b.addEventListener("touchstart",function(e){b.classList.add("hit");padDown(d,e)},{passive:false});b.addEventListener("touchend",function(e){b.classList.remove("hit");padUp(d,e)},{passive:false});b.addEventListener("touchcancel",function(e){b.classList.remove("hit");padUp(d,e)},{passive:false});
b.addEventListener("mousedown",function(e){padDown(d,e)});b.addEventListener("mouseup",function(e){padUp(d,e)});b.addEventListener("mouseleave",function(e){if(HELD==d)HELD=null})});
var bA=document.getElementById("bA");bA.addEventListener("touchstart",function(e){e.preventDefault();bA.classList.add("hit");action()},{passive:false});bA.addEventListener("touchend",function(e){e.preventDefault();bA.classList.remove("hit")},{passive:false});bA.addEventListener("mousedown",function(e){e.preventDefault();action()});
document.getElementById("dlg").addEventListener("click",function(){if(DLG)dlgNext()});
var KD={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"};
document.addEventListener("keydown",function(e){if(e.target&&e.target.tagName=="INPUT")return;if(!OV.hidden||document.getElementById("modal"))return;var d=KD[e.key];
if(d){e.preventDefault();if(e.repeat)return;initAudio();padDown(d)}else if(e.key==" "||e.key=="Enter"){e.preventDefault();if(!e.repeat)action()}else if((e.key=="c"||e.key=="C")&&!DLG){book()}else if(e.key=="Escape"&&DLG){dlgNext()}});
document.addEventListener("keyup",function(e){var d=KD[e.key];if(d)padUp(d)});
window.addEventListener("blur",function(){HELD=null});
/* read-only hooks for automated tests */
window.__rpg={st:function(){return {map:CUR&&CUR.id,x:PL.x,y:PL.y,d:PL.d,moving:PL.moving,dlg:!!DLG,ov:!OV.hidden,modal:!!document.getElementById("modal"),fading:FADING,act:S&&act()}},
grid:function(){if(!CUR)return null;var g=[];for(var y=0;y<CUR.H;y++){var r="";for(var x=0;x<CUR.W;x++)r+=doorAt(CUR,x,y)?"D":blocked(x,y)?"#":".";g.push(r)}return g},
spots:function(){return CUR.spots.map(function(s){return {x:s.x,y:s.y,w:s.w,h:s.h,l:s.l||(s.hs!=null?RM[CUR.ri].hs[s.hs].l:""),hs:s.hs,pz:s.pz,flav:!!s.flav,gong:s.gong}})},
npcs:function(){return NPCS.map(function(n){return {p:n.p,x:n.x,y:n.y}})},doors:function(){return CUR.doors.map(function(d){return {x:d.x,y:d.y,to:d.to}})}};
layout();requestAnimationFrame(loop);

title();
</script>
